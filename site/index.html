<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#13191a" />
    <title>CHUNITHM · 历代定数档案</title>
    <link rel="icon" href="assets/mark.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="bar">
        <b class="brand"
          ><img src="assets/mark.svg" alt="" />CHUNITHM <em>ARCHIVE</em></b
        ><span class="region"><i></i> 日服曲库</span
        ><a
          class="repo"
          href="https://github.com/unknnownnn003/chuni-const"
          aria-label="GitHub 源码"
          >GitHub ↗</a
        >
      </div>
    </header>
    <main>
      <section class="library" aria-labelledby="libTitle">
        <div class="sectionline">
          <h1 id="libTitle"><span class="gridicon" aria-hidden="true">▦</span> 谱面矩阵</h1>
        </div>
        <form id="tools" onsubmit="return false">
          <div class="controls">
            <label class="search"
              ><span>⚲</span
              ><input
                id="q"
                type="search"
                placeholder="搜索曲名、曲师或谱师"
                aria-label="搜索曲名、曲师或谱师"
              /><kbd>/</kbd></label
            ><button type="button" id="filters" aria-expanded="false">
              ☷　筛选</button
            ><label class="sort"
              >排序
              <select id="sort">
                <option value="id">默认排序</option>
                <option value="title">曲名 A–Z</option>
                <option value="level">定数从高到低</option>
              </select></label
            >
          </div>
          <div id="extra" class="extra" hidden>
            <label>日服版本<select id="ver"></select></label
            ><label>曲目分类<select id="genre"></select></label
            ><label
              >定数下限<input
                type="number"
                id="min"
                step="0.01"
                min="0"
                placeholder="不限" /></label
            ><label
              >定数上限<input
                type="number"
                id="max"
                step="0.01"
                min="0"
                placeholder="不限" /></label
            ><label class="version-toggle">
              <input type="checkbox" id="hideEmptyVersions" role="switch" />
              忽略未实装版本
            </label><button type="button" id="reset">重置筛选</button>
          </div>
          <div class="difficulties" id="diff" aria-label="谱面难度"></div>
        </form>
        <div class="resultline">
          <span id="count" role="status">载入中…</span
          ><span class="legend"
            ><b class="up">▲</b> 上升　<b class="down">▼</b> 下降　<b
              class="first"
              >●</b
            >
            新增　<b class="removed">×</b> 删除</span
          >
        </div>
        <div id="viewport" tabindex="0" role="region" aria-labelledby="libTitle" aria-describedby="matrixHint">
          <div id="matrix">
            <div id="head"></div>
            <div id="body"></div>
          </div>
        </div>
        <div class="foot">
          <span id="matrixHint">拖动浏览 · 双指捏合或 Ctrl + 滚轮缩放</span>
          <div class="zoom" role="group" aria-label="矩阵缩放">
            <button type="button" id="zoomOut" aria-label="缩小矩阵">−</button>
            <button type="button" id="zoomReset" aria-label="重置矩阵缩放">100%</button>
            <button type="button" id="zoomIn" aria-label="放大矩阵">+</button>
          </div>
        </div>
      </section>
    </main>
    <dialog id="modal">
      <button class="close" aria-label="关闭">×</button>
      <div id="detail"></div>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
